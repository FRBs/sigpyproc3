name: GitHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Ruff & ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dev tools
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"

    env:
      # macOS otherwise selects the MacOSX backend. plt.show() then blocks,
      # and the viewer tests never finish.
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: uv sync --extra tests

      - name: Run pytest
        run: uv run pytest -q

  coverage:
    name: line coverage (Python + Numba compilation)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      NUMBA_NUM_THREADS: "2"
      NUMBA_JIT_COVERAGE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra tests
      - name: Test and measure line coverage
        # runner is valid only in a step. A fresh directory makes Numba
        # compile every kernel and report those lines.
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          name: python-and-numba-compilation
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  distributions:
    name: distribution build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build the wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Import from the installed wheel
        run: |
          uv venv /tmp/sigpyproc-wheel
          uv pip install --python /tmp/sigpyproc-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/sigpyproc-wheel/bin/python - <<'PY'
          import inspect
          import pathlib

          import sigpyproc
          from sigpyproc.timeseries import TimeSeries

          location = pathlib.Path(inspect.getfile(sigpyproc))
          if "site-packages" not in location.parts:
              raise SystemExit(f"imported from the checkout: {location}")
          if not (location.parent / "py.typed").is_file():
              raise SystemExit(f"py.typed missing from {location.parent}")
          assert TimeSeries is not None
          PY
          /tmp/sigpyproc-wheel/bin/spp_header --help >/dev/null

