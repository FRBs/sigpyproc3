minimum_pre_commit_version: "3.5.0"

exclude: ^(.cache|\.venv)/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        files: ^(src/|pyproject\.toml)
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]