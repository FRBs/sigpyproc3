[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "sigpyproc"
version = "2.0.0"
description = "Python FRB/pulsar data toolbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pravir Kumar", email = "pravirka@gmail.com" },
    { name = "Ewan Barr" },
]
maintainers = [{ name = "Pravir Kumar", email = "pravirka@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
keywords = ["pulsar", "FRB", "filterbank", "SIGPROC", "PSRFITS", "radio astronomy"]
dependencies = [
    "numpy>=2.0",
    "numba>=0.61",
    "astropy>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "h5py>=3.10",
    "bottleneck>=1.4",
    "attrs>=24",
    "click>=8.1",
    "rich>=13",
    "rich-click>=1.8",
    "rocket-fft>=0.3",
    "bidict>=0.23",
    "lazy-loader>=0.4",
]

[project.urls]
Repository = "https://github.com/FRBs/sigpyproc3"
Documentation = "https://sigpyproc3.readthedocs.io"
Changelog = "https://sigpyproc3.readthedocs.io/en/latest/changes.html"
Issues = "https://github.com/FRBs/sigpyproc3/issues"

[project.optional-dependencies]
tests = [
    "pytest>=9.0",
    "pytest-cov",
    "pytest-randomly",
    "pytest-sugar",
    "pytest-benchmark",
    "pytest-mock",
    "scipy>=1.13",
]
dev = [
    "ruff",
    "ty",
]
docs = [
    "sphinx",
    "sphinx-book-theme",
    "sphinx-click",
    "sphinx-copybutton",
    "numpydoc",
    "myst-nb",
    "jupyter_sphinx",
    "sphinx-design",
]

[project.scripts]
spp_header = "sigpyproc.apps.spp_header:main"
spp_extract = "sigpyproc.apps.spp_extract:main"
spp_clean = "sigpyproc.apps.spp_clean:main"
spp_stats = "sigpyproc.apps.spp_stats:main"
spp_decimate = "sigpyproc.apps.spp_decimate:main"
spp_bandpass = "sigpyproc.apps.spp_bandpass:main"
spp_zerodm = "sigpyproc.apps.spp_zerodm:main"
spp_merge = "sigpyproc.apps.spp_merge:main"
spp_splice = "sigpyproc.apps.spp_splice:main"
spp_dedisperse = "sigpyproc.apps.spp_dedisperse:main"
spp_fold = "sigpyproc.apps.spp_fold:main"
spp_fake = "sigpyproc.apps.spp_fake:main"
spp_search = "sigpyproc.apps.spp_search:main"
spp_digifil = "sigpyproc.apps.spp_digifil:main"
spp_view = "sigpyproc.apps.spp_view:main"


[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "src/**/*.pyi", "tests/**/*.py", "docs/**/*.py"]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D1", "D301", "PLR2004", "G004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"src/sigpyproc/kernels/**.py" = ["ARG001", "C901", "PLR0912", "PLR0915"]
"src/sigpyproc/timeseries.py" = ["ANN401"] # numpy.pad kwargs depend on mode
"src/sigpyproc/apps/spp_fake.py" = ["PLR0913", "PLR0917"]
"src/sigpyproc/apps/spp_digifil.py" = ["PLR0913"]
"src/sigpyproc/apps/spp_view.py" = ["PLR0913", "PLR0917"]
"src/sigpyproc/viz/**.py" = ["PLR0913", "PLR0912", "PLR0915", "PLR0917", "FBT001", "FBT002", "T201", "C901"]
"tests/**/*.py" = ["S101", "FBT", "PLR2004", "PT011", "SLF001"]
"docs/**" = ["INP001", "ARG001", "ANN401"]
"bench/**" = ["INP001", "S603"]

[tool.ruff.lint.pylint]
max-args = 15

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ty.rules]
not-iterable = "ignore" # For Numba prange

[[tool.ty.overrides]]
include = ["tests/test_stats.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["src/sigpyproc/kernels/*.py"]

[tool.ty.overrides.rules]
no-matching-overload = "ignore" # numba Dispatcher.py_func is not modelled by ty

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.run]
omit = ["tests/*", "docs/*", "*__init__.py", "*_types.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
ignore_errors = true
exclude_lines = [
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'except ModuleNotFoundError:',
    'if __name__ == "__main__":',
    'if outfile_name is None:',
]

[tool.numpydoc_validation]
checks = ["all", "GL01", "GL08", "EX01", "SA01", "ES01", "SS02", "SA04"]
exclude = ['\.undocumented_method$', '\.__repr__$']
